<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="content">
        <div id="menu">
            <div class="add-task-div"><!-- Improve the svgs and buttons a bit so that it seems presentable then do the logic for UI rendering of Project into the menu div -->
                <button id="add-task-menu" command="show-modal" commandfor="add-task-dialog">
                    <span>
                        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="#000000" class="bi bi-plus-circle-fill">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3v-3z"></path>
                            </g>
                        </svg>
                        <p>Add task</p>
                    </span>
                </button>
                <dialog id="add-task-dialog">
                        <form action="">
                            <label for="task-name">Task Title: </label>
                            <input id="task-name" type="text">

                            <label for="task-description">Task Description: </label>
                            <input id="task-description" type="text">

                            <label for="task-due-date">Due Date: </label>
                            <input id="task-due-date" type="date">

                            <label for="task-priority">Priority: </label>
                            <select id="task-priority">
                                <option value="1">Priority 1</option>
                                <option value="2">Priority 2</option>
                                <option value="3">Priority 3</option>
                                <option value="4" selected> Priority 4</option>
                            </select>

                            <label for="select-project-input">Project: </label>
                            <select id="select-project-input">
                                <option value="">Select Project</option>
                                <!-- A list of project's name with the value being their getProjectId -->
                            </select>

                            <button type="submit" id="submit-create-task">Create Task</button>
                        </form>
                        <button commandfor="add-task-dialog" command="close">Close</button>
                </dialog>
            </div class="completed project">
                <p>Completed</p>
            <div>
                <p></p></div>
            <div class="projects-div">
                <div class="add-project-div">
                    <h2>My Projects</h2>
                    <button id="add-project-btn" command="show-modal" commandfor="add-project-dialog">
                        <svg width="123px" height="123px" viewBox="-8.64 -8.64 49.28 49.28" id="i-plus" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.496">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <path d="M16 2 L16 30 M2 16 L30 16"></path>
                            </g>
                        </svg>
                    </button>
                    <dialog id="add-project-dialog">
                        <form action="">
                            <label for="project-name">Project Title: </label>
                            <input id="project-name" type="text">
                            <button type="submit" id="submit-create-project">Create Project</button>
                        </form>
                        <button commandfor="add-project-dialog" command="close">Cancel</button>
                    </dialog>
                </div>
                <div id="list-of-projects">
                    
                </div>
            </div>
        </div>
        <div id="main-content">
            <div class="task-container">
                <h2 class="task-project-title">My Project Name</h2>
                <ul class="ul-tasks">
                    <!-- To Do tasks gets dynamically appended here -->
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
